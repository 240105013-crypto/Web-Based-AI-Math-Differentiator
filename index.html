<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Math Differentiator</title>
    <!-- Tailwind CSS (Дизайн әдемі болуы үшін) -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold text-center text-indigo-600 mb-2">🧮 AI Math Differentiator</h1>
        <p class="text-center text-gray-600 mb-6">Topic: AI for Differentiated Learning</p>

        <!-- API Key және Есеп енгізу -->
        <div class="mb-6 p-4 bg-indigo-50 rounded-lg">
            <label class="block font-semibold mb-1">OpenAI API Key:</label>
            <input type="password" id="apiKey" class="w-full p-2 border rounded mb-3 bg-white" placeholder="sk-...">
            
            <label class="block font-semibold mb-1">Core Math Problem / Equation:</label>
            <input type="text" id="mathProblem" class="w-full p-2 border rounded bg-white" value="x^2 - 5x + 6 = 0">
        </div>

        <!-- Деңгейлерді таңдау -->
        <div class="mb-6">
            <label class="block font-semibold mb-2">Select Learner Proficiency Level:</label>
            <div class="space-y-2">
                <label class="flex items-center space-x-2 p-2 border rounded cursor-pointer hover:bg-gray-50">
                    <input type="radio" name="level" value="Level 1: Foundation (Simplified context, step-by-step breakdown, direct hints)" checked>
                    <span>Level 1: Foundation</span>
                </label>
                <label class="flex items-center space-x-2 p-2 border rounded cursor-pointer hover:bg-gray-50">
                    <input type="radio" name="level" value="Level 2: Standard (Standard curriculum grade-level problem solving)">
                    <span>Level 2: Standard</span>
                </label>
                <label class="flex items-center space-x-2 p-2 border rounded cursor-pointer hover:bg-gray-50">
                    <input type="radio" name="level" value="Level 3: Advanced (Complex extension, real-world application, multi-step logic)">
                    <span>Level 3: Advanced</span>
                </label>
            </div>
        </div>

        <button onclick="generateAI()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded transition">
            Generate AI Differentiated Task
        </button>

        <!-- Нәтиже шығатын жер -->
        <div id="loading" class="hidden text-center my-4 font-semibold text-indigo-600 animate-pulse">AI thinking... Please wait...</div>
        <div id="output" class="mt-8 whitespace-pre-line border-t pt-4 text-gray-800 hidden"></div>
    </div>

    <script>
        async function generateAI() {
            const apiKey = document.getElementById('apiKey').value;
            const problem = document.getElementById('mathProblem').value;
            const level = document.querySelector('input[name="level"]:checked').value;
            const outputDiv = document.getElementById('output');
            const loadingDiv = document.getElementById('loading');

            if (!apiKey) {
                alert('Please enter your OpenAI API Key!');
                return;
            }

            loadingDiv.classList.remove('hidden');
            outputDiv.classList.add('hidden');

            const systemPrompt = "You are an expert Educational AI assistant specializing in differentiated instruction for secondary school mathematics. Your goal is to adapt the core math problem perfectly to match the student's level. Structure the output clearly with: 1) Differentiated Task, 2) Hints & Guidance, 3) Full Explanatory Solution.";
            const userPrompt = `Core Problem: ${problem}\nTarget Level: ${level}\n\nAdapt this problem and provide hints and solution tailored exactly for this level.`;

            try {
                const response = await fetch('https://openai.com', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userPrompt }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    outputDiv.innerText = data.choices[0].message.content;
                    outputDiv.classList.remove('hidden');
                } else {
                    alert('Error from API. Please check your API key.');
                }
            } catch (error) {
                alert('Connection error: ' + error.message);
            } finally {
                loadingDiv.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
