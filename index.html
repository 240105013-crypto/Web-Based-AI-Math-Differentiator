<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>AI Math Differentiator — Future Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://jsdelivr.net"></script>
    <!-- Әдемі әрі ерекше қаріптер (Шрифттер) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .font-cyber { font-family: 'Orbitron', sans-serif; }

<body class="bg-slate-950 font-main min-h-screen flex items-center justify-center p-4 md:p-8 relative overflow-x-hidden">

    <!-- Фондағы заманауи жарқыраған түсті шарлар (Неон эффектісі) -->
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-cyan-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Басты футуристік панель -->
    <div class="max-w-3xl w-full bg-slate-900/40 backdrop-blur-xl p-6 md:p-10 rounded-3xl shadow-[0_0_50px_rgba(168,85,247,0.15)] border border-purple-500/20 relative z-10">
        
        <!-- Ерекше Математикалық Эмблема және Тақырып -->
        <div class="text-center mb-10 relative">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-fuchsia-500 via-purple-600 to-cyan-500 p-[2px] shadow-[0_0_30px_rgba(192,38,211,0.4)] mb-4 animate-bounce duration-[3s]">
                <div class="w-full h-full bg-slate-950 rounded-[14px] flex flex-col items-center justify-center font-cyber font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-cyan-400">
                    <span class="text-2xl leading-none">∑</span>
                    <span class="text-xs text-purple-400 leading-none mt-0.5">f(x)</span>
                </div>
            </div>
            
            <h1 class="font-cyber text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-400 to-cyan-400 uppercase tracking-wider mb-2">
                AI Math Differentiator
            </h1>
            <div class="inline-block px-3 py-1 bg-purple-950/50 border border-purple-500/30 rounded-full">
                <p class="text-cyan-400 text-xs font-semibold uppercase tracking-widest font-cyber">Topic 8: Adaptive Learning Engine</p>
            </div>
        </div>

        <!-- Енгізу блоктары (Необычный дизайн) -->
        <div class="space-y-4 mb-8">
            <div class="p-6 bg-slate-950/80 rounded-2xl border border-slate-800 focus-within:border-cyan-500/50 transition duration-300">
                <label class="block font-cyber font-bold text-pink-400 text-xs tracking-widest uppercase mb-2">🔑 Secure OpenAI API Key</label>
                <input type="password" id="apiKey" class="w-full p-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition mb-5 font-mono" placeholder="sk-proj-........................">
                
                <label class="block font-cyber font-bold text-cyan-400 text-xs tracking-widest uppercase mb-2">📐 Core Math Problem / Formula</label>
                <input type="text" id="mathProblem" class="w-full p-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-cyan-300 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition font-mono text-lg shadow-inner" value="x^2 - 5x + 6 = 0">
            </div>
        </div>

        <!-- Деңгейлерді таңдау (Геймификация стилінде) -->
        <div class="mb-8">
            <label class="block font-cyber font-bold text-slate-400 text-xs tracking-widest uppercase mb-4">🎚️ Select Target Proficiency Level</label>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                
                <!-- Level 1 -->
                <label class="relative flex flex-col p-4 bg-slate-950/60 border border-slate-800 rounded-2xl cursor-pointer hover:border-pink-500/50 hover:shadow-[0_0_15px_rgba(236,72,153,0.1)] transition group">
                    <input type="radio" name="level" value="Level 1: Foundation (Simplified context, step-by-step breakdown, direct hints)" checked class="absolute top-4 right-4 text-pink-500 focus:ring-0 bg-slate-900 border-slate-700">
                    <span class="font-cyber font-black text-pink-500 tracking-wide text-sm mb-1 uppercase">Level 01</span>
                    <span class="font-bold text-slate-200 text-sm mb-1">Foundation</span>
                    <span class="text-[11px] text-slate-400 leading-normal">Guided steps, breakdown & basic micro-hints.</span>
                </label>

                <!-- Level 2 -->
                <label class="relative flex flex-col p-4 bg-slate-950/60 border border-slate-800 rounded-2xl cursor-pointer hover:border-purple-500/50 hover:shadow-[0_0_15px_rgba(168,85,247,0.1)] transition group">
                    <input type="radio" name="level" value="Level 2: Standard (Standard curriculum grade-level problem solving)" class="absolute top-4 right-4 text-purple-500 focus:ring-0 bg-slate-900 border-slate-700">
                    <span class="font-cyber font-black text-purple-400 tracking-wide text-sm mb-1 uppercase">Level 02</span>
                    <span class="font-bold text-slate-200 text-sm mb-1">Standard</span>
                    <span class="text-[11px] text-slate-400 leading-normal">Standard curriculum grade-level fluency equations.</span>
                </label>

                <!-- Level 3 -->
                <label class="relative flex flex-col p-4 bg-slate-950/60 border border-slate-800 rounded-2xl cursor-pointer hover:border-cyan-500/50 hover:shadow-[0_0_15px_rgba(6,182,212,0.1)] transition group">
                    <input type="radio" name="level" value="Level 3: Advanced (Complex extension, real-world application, multi-step logic)" class="absolute top-4 right-4 text-cyan-500 focus:ring-0 bg-slate-900 border-slate-700">
                    <span class="font-cyber font-black text-cyan-400 tracking-wide text-sm mb-1 uppercase">Level 03</span>
                    <span class="font-bold text-slate-200 text-sm mb-1">Advanced</span>
                    <span class="text-[11px] text-slate-400 leading-normal">Complex extensions & real-world matrix logic.</span>
                </label>

            </div>
        </div>

        <!-- Керемет Неон Батырма -->
        <button onclick="generateAI()" class="w-full relative group overflow-hidden rounded-2xl p-[2px] focus:outline-none shadow-[0_0_30px_rgba(168,85,247,0.3)] active:scale-[0.99] transition duration-150">
            <span class="absolute inset-0 bg-gradient-to-r from-pink-500 via-purple-600 to-cyan-500 rounded-2xl"></span>
            <div class="px-8 py-4 bg-slate-950 rounded-[14px] relative group-hover:bg-slate-900/50 transition duration-300 text-center">
                <span class="font-cyber font-black text-white tracking-widest text-sm uppercase bg-clip-text">
                    ⚡ Execute Differentiation ⚡
                </span>
            </div>
        </button>

        <!-- Жүктелу индикаторы -->
        <div id="loading" class="hidden text-center my-8 font-cyber font-bold text-sm tracking-widest text-purple-400 animate-pulse">
            🛸 MATRIX SCANNING IN PROGRESS... PLEASE WAIT...
        </div>
        
        <!-- Нәтиже шығатын әдемі блок -->
        <div id="output" class="mt-8 p-6 bg-slate-950/90 border border-slate-800 rounded-2xl text-slate-300 whitespace-pre-line hidden shadow-[inset_0_0_20px_rgba(0,0,0,0.6)] font-sans leading-relaxed text-sm md:text-base border-t-2 border-t-purple-500"></div>
    </div>

    <script>
        async function generateAI() {
            const apiKey = document.getElementById('apiKey').value;
            const problem = document.getElementById('mathProblem').value;
            const level = document.querySelector('input[name="level"]:checked').value;
            const outputDiv = document.getElementById('output');
            const loadingDiv = document.getElementById('loading');

            if (!apiKey) {
                alert('Please enter your OpenAI API Key!');
                return;
            }

            loadingDiv.classList.remove('hidden');
            outputDiv.classList.add('hidden');

            const systemPrompt = "You are an expert Educational AI assistant specializing in differentiated instruction for secondary school mathematics. Your goal is to adapt the core math problem perfectly to match the student's level. Structure the output clearly with: 1) Differentiated Task, 2) Hints & Guidance, 3) Full Explanatory Solution.";
            const userPrompt = `Core Problem: ${problem}\nTarget Level: ${level}\n\nAdapt this problem and provide hints and solution tailored exactly for this level.`;

            try {
                const response = await fetch('https://openai.com', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userPrompt }
                        ],
                        temperature: 0.7
                    })
